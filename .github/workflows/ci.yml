name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  binaries:
    # CI owns the shipped binaries: on every push to main it rebuilds them from source with the
    # pinned toolchain and commits them if they changed, so they are never built on a developer
    # machine. Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: ./build.sh
      - name: Commit the binaries if they changed
        run: |
          if git diff --quiet -- plugins/sigill-evidence/libexec && [ -z "$(git status --porcelain -- plugins/sigill-evidence/libexec)" ]; then
            echo "Binaries are what this source builds to."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/sigill-evidence/libexec
          git commit -m "build: plugin binaries for ${GITHUB_SHA::7}"
          git push origin HEAD:main

  pr-binaries:
    # Pull requests change sources only; the binaries are CI's (job above). A PR must still build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Binaries are not edited by hand
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^plugins/sigill-evidence/libexec/'; then
            echo "::error::Do not commit plugin binaries; CI builds and commits them after merge."
            exit 1
          fi
      - name: Build
        run: ./build.sh
